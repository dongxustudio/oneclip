<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>OneClip</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ═══ Title Bar ═══ -->
  <div id="titlebar">
    <span id="titlebar-title">
      <svg class="app-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.55 3c-3.852.007-5.87.102-7.159 1.39C2 5.783 2 8.022 2 12.5s0 6.717 1.391 8.109C4.783 22 7.021 22 11.501 22c4.478 0 6.717 0 8.108-1.391c1.29-1.29 1.384-3.307 1.391-7.16"/>
        <path d="M11.056 13C10.332 3.866 16.802 1.276 21.98 2.164c.209 3.027-1.273 4.16-4.093 4.684.545.57 1.507 1.286 1.403 2.18-.074.638-.506.95-1.372 1.576-1.896 1.37-4.093 2.234-6.863 2.396"/>
        <path d="M9 17c2-5.5 3.96-7.364 6-9"/>
      </svg>
      OneClip
    </span>
    <div id="titlebar-controls">
      <button id="btn-pin" class="titlebar-btn" aria-label="Always on Top" title="Always on Top">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="17" x2="12" y2="22"/>
          <path d="M5 17h14v-6c0-3.9-3.1-7-7-7s-7 3.1-7 7v6z"/>
          <line x1="9" y1="11" x2="15" y2="11"/>
        </svg>
      </button>
      <button id="btn-minimize" class="titlebar-btn" aria-label="Minimize">
        <svg width="10" height="10" viewBox="0 0 10 10">
          <line x1="1.5" y1="5" x2="8.5" y2="5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
      <button id="btn-close" class="titlebar-btn" aria-label="Close to tray">
        <svg width="10" height="10" viewBox="0 0 10 10">
          <line x1="2" y1="2" x2="8" y2="8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          <line x1="8" y1="2" x2="2" y2="8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ═══ Toolbar ═══ -->
  <div id="toolbar">
    <div id="search-box">
      <svg class="search-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="10.5" cy="10.5" r="7.5"/>
        <line x1="16" y1="16" x2="21" y2="21"/>
      </svg>
      <input type="text" id="search-input" placeholder="Search snippets..." autocomplete="off">
      <button id="btn-search-clear" class="btn-clear hidden" aria-label="Clear search">&times;</button>
    </div>
    <button id="btn-add" class="btn-accent" aria-label="New snippet">New</button>
  </div>

  <!-- ═══ Group Chip Bar ═══ -->
  <div id="group-bar" class="hidden">
    <div id="group-bar-scroll">
      <button class="group-chip active" data-group="">All</button>
    </div>
    <button id="btn-add-group" class="btn-add-group" title="New Group">+</button>
  </div>

  <!-- ═══ Snippet List ═══ -->
  <main id="snippet-list"></main>

  <!-- ═══ Empty State ═══ -->
  <div id="empty-state" class="hidden">
    <div id="empty-title">No snippets yet</div>
    <div id="empty-desc">Create your first text snippet</div>
    <button class="btn-accent" id="btn-empty-add">New Snippet</button>
  </div>

  <!-- ═══ No Results ═══ -->
  <div id="no-results" class="hidden">
    <div id="no-results-text">No matching snippets</div>
  </div>

  <!-- ═══ New Group Modal ═══ -->
  <div id="group-editor-overlay" class="modal-overlay hidden">
    <div id="group-editor-modal" class="modal modal-sm" role="dialog" aria-labelledby="group-editor-title" aria-modal="true">
      <div class="modal-header">
        <span id="group-editor-title">New Group</span>
        <button id="btn-group-editor-close" class="modal-close-btn" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <label for="input-group-name">Group Name</label>
        <input type="text" id="input-group-name" placeholder="e.g. Work, Personal..." maxlength="50" autocomplete="off">
        <div class="editor-hints">
          <span>Enter to create</span>
          <span class="hint-separator">·</span>
          <span>Esc to cancel</span>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-group-editor-cancel" class="btn-ghost">Cancel</button>
        <button id="btn-group-editor-create" class="btn-accent">Create</button>
      </div>
    </div>
  </div>

  <!-- ═══ Group Context Menu ═══ -->
  <div id="group-context-menu" class="context-menu hidden">
    <button class="context-menu-item" data-action="new-snippet">New Snippet</button>
    <button class="context-menu-item" data-action="rename">Rename</button>
    <button class="context-menu-item context-menu-danger" data-action="delete">Delete</button>
  </div>

  <!-- ═══ Toast ═══ -->
  <div id="toast" class="hidden"></div>

  <!-- ═══ Editor Modal ═══ -->
  <div id="editor-overlay" class="modal-overlay hidden">
    <div id="editor-modal" class="modal" role="dialog" aria-labelledby="editor-title" aria-modal="true">
      <div class="modal-header">
        <span id="editor-title">New Snippet</span>
        <button id="btn-editor-close" class="modal-close-btn" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body">
        <label for="input-title">Title</label>
        <input type="text" id="input-title" placeholder="e.g. Greeting, Address, Signature..." maxlength="100" autocomplete="off">
        <label for="input-group">Group</label>
        <div class="group-input-wrapper">
          <input type="text" id="input-group" placeholder="e.g. Work, Personal... (optional)" autocomplete="off">
          <button id="btn-group-dropdown" class="btn-dropdown-arrow" tabindex="-1" title="Show all groups">▾</button>
          <div id="group-dropdown" class="group-dropdown hidden"></div>
        </div>
        <label for="input-content">Content</label>
        <textarea id="input-content" placeholder="Paste or type the text you want to copy later" rows="6"></textarea>
        <div class="editor-hints">
          <span>Ctrl+Enter to save</span>
          <span class="hint-separator">·</span>
          <span>Esc to cancel</span>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-editor-cancel" class="btn-ghost">Cancel</button>
        <button id="btn-editor-save" class="btn-accent">Save</button>
      </div>
    </div>
  </div>

  <!-- ═══ Delete Confirm Modal ═══ -->
  <div id="delete-overlay" class="modal-overlay hidden">
    <div id="delete-modal" class="modal modal-sm" role="dialog" aria-labelledby="delete-title" aria-modal="true">
      <div class="modal-header">
        <span id="delete-title">Delete Snippet</span>
      </div>
      <div class="modal-body">
        <div class="delete-body">
          <p id="delete-snippet-name" class="delete-name"></p>
          <p id="delete-snippet-preview" class="delete-preview"></p>
          <div id="delete-group-options" class="hidden">
            <label for="delete-target-group" style="margin-top:0">Move snippets to</label>
            <select id="delete-target-group" style="width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg);font-size:var(--text-body);color:var(--text);margin-bottom:var(--sp-2)">
              <option value="">Uncategorized</option>
            </select>
          </div>
          <p class="delete-warning">This action cannot be undone.</p>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-delete-cancel" class="btn-ghost">Cancel</button>
        <button id="btn-delete-confirm" class="btn-danger">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/search.js"></script>
  <script src="js/snippet-list.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
